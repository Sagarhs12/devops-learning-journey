<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CI/CD Pipeline Success</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 40px 50px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 420px;
      animation: fadeIn 1.2s ease-in-out;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2.1rem;
    }

    p {
      margin: 10px 0;
      font-size: 1.05rem;
      opacity: 0.95;
    }

    .badge {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 16px;
      border-radius: 20px;
      background: #00e676;
      color: #003300;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .footer {
      margin-top: 25px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🚀 CI/CD Pipeline Successful</h1>
    <p>Your application has been deployed automatically</p>
    <p>using <strong>Jenkins</strong> with zero manual intervention.</p>

    <div class="badge">✔ Build • Test • Deploy</div>

    <div class="footer">
      👨‍💻 Author: <strong>Sagar Shivappayyanamath</strong>
    </div>
  </div>
</body>
</html>
